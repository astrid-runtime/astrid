[package]
name = "astrid-storage"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Unified storage integration for Astrid principal state, raw KV, and query storage"

[features]
default = []
# Deprecated compatibility alias. KV is always backed by the native object
# store; this remains only so existing downstream feature selections compile.
kv = []
legacy-surrealkv = ["dep:surrealkv"]
db = ["dep:surrealdb"]
keychain = ["dep:keyring"]
full = ["kv", "legacy-surrealkv", "db"]

[dependencies]
astrid-core = { workspace = true }
astrid-storage-content = { workspace = true }
astrid-storage-engine = { workspace = true }
astrid-storage-model = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
keyring = { workspace = true, optional = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
surrealkv = { workspace = true, optional = true }
surrealdb = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "storage_io"
harness = false

# Astrid's wasm-capable crates use getrandom 0.4 with its `wasm_js` backend.
# surrealkv still pulls a separate getrandom 0.3 edge; its backend is configured
# for portability checks through RUSTFLAGS below. wasm-only; native builds are
# unaffected.
# Requires the build to be run with RUSTFLAGS='--cfg getrandom_backend="wasm_js"'
# (see scripts/check-wasm-portability.sh).
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
blake3 = { workspace = true }

[lints]
workspace = true
