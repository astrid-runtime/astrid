[package]
name = "astrid-storage-engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "User-space principal-store engine for Astrid"

[features]
default = []
# Test-only byte-level persistence traces and crash-image generation. This is
# opt-in so the recovery harness never enters production engine builds.
crash-replay = []

[dependencies]
astrid-storage-model = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
astrid-storage-content = { workspace = true }
blake3 = { workspace = true }
cap-std = "4.0.2"
fs2 = { workspace = true }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
