[package]
name = "astrid-storage-provider-winfsp"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native Windows WinFsp filesystem provider for Astrid storage mounts"

[dependencies]
anyhow = { workspace = true }
astrid-core = { workspace = true }
astrid-uplink = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
blake3 = { workspace = true }
widestring = "1.1"
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }
winfsp_wrs = "0.4.1"

[target.'cfg(windows)'.build-dependencies]
winfsp_wrs_build = "0.4.1"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
