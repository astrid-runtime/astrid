[package]
name = "astrid-capsule-types"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Engine-agnostic capsule types shared by all Astrid capsule engines"

[dependencies]
web-time = "1.1.0"
vstd = { version = "=0.0.0-2026-11-22-0344", default-features = false }
astrid-core = { workspace = true }
dashmap = { workspace = true }
event-listener = "5.4.2"
parking_lot = { workspace = true }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)', 'cfg(verus_verify_core)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
