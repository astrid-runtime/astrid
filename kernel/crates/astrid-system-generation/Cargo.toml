[package]
name = "astrid-system-generation"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "astrid_system_generation"
path = "src/lib.rs"

[features]
default = []
sign = []
# Development-only values used by the emulator kimage/ring-0 fixtures. The
# default production API intentionally does not expose these constants.
emulator-fixture = []

[dependencies]
blake3 = { version = "=1.8.5", default-features = false, features = ["pure"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }
