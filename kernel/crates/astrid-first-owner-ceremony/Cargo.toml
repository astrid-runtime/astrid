[package]
name = "astrid-first-owner-ceremony"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.95"

[lib]
name = "astrid_first_owner_ceremony"
path = "src/lib.rs"

[dependencies]
blake3 = { version = "=1.8.5", default-features = false, features = ["pure"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }
