[package]
name = "astrid-native-kernel"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "astrid_native_kernel"
test = true
bench = false

[[bin]]
name = "astrid-native-kernel"
test = false
bench = false

[dependencies]
# Boot contract. `bootloader_api` must match the `bootloader` builder version
# used by tools/kimage exactly (the loader embeds an API-version check).
bootloader_api = { path = "../../tools/bootloader/api", version = "=0.11.16" }
# Bare-metal x86-64 primitives. Default features pull in `nightly`; on the
# pinned stable toolchain we take only `instructions` and register interrupt
# handlers via the stable `Entry::set_handler_addr` path (naked-fn ISR stubs),
# never the nightly `extern "x86-interrupt"` ABI.
x86_64 = { version = "=0.15.5", default-features = false, features = ["instructions"] }
# Fallible bump/free-list heap used directly as `Heap` (no #[global_allocator]).
linked_list_allocator = { version = "=0.10.6", default-features = false }
spin = "=0.9.9"
raw-cpuid = "=11.6.0"

astrid-native-closure = { path = "../astrid-native-closure" }
astrid-system-generation = { path = "../astrid-system-generation", default-features = false, features = ["emulator-fixture"] }
# Rolling audit root. Same frozen pure backend as the sibling kernel crates.
# Zeroize makes custody erasure explicit for Hasher and digest state.
blake3 = { version = "=1.8.5", default-features = false, features = ["pure", "zeroize"] }
# Exact-pinned volatile erasure for seed/key temporaries.
zeroize = { version = "=1.9.0", default-features = false }
# Native verifier is independently written but must be usable in-kernel for
# direct, move-only custody of the live anchor.
native-audit-verifier = { path = "../../tools/native-audit-verifier" }

[dev-dependencies]
# Private host verifier: kernel audit tests cross-check the canonical frames,
# rolling root, and checkpoint tags against the independent decoder.
native-audit-verifier = { path = "../../tools/native-audit-verifier" }
