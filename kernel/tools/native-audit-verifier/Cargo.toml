[package]
name = "native-audit-verifier"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "native_audit_verifier"
test = true
bench = false

[dependencies]
# Same frozen pure backend as the kernel crates so digests cannot differ by
# feature selection. Zeroize makes anchor and hasher teardown explicit.
blake3 = { version = "=1.8.5", default-features = false, features = ["pure", "zeroize"] }
# Bounded native verifier hashing state stays out of the small domain stack.
spin = "=0.9.9"
zeroize = { version = "=1.9.0", default-features = false }
