# Astrid native-kernel M1 workspace.
#
# Isolated from the surrounding core/ workspace. A nested [workspace] is
# auto-excluded from the parent, so core/ never ingests these crates.
[workspace]
resolver = "2"
members = [
    "crates/astrid-native-closure",
    "crates/astrid-native-kernel",
    "crates/astrid-boot-selection",
    "crates/astrid-init-plan",
    "crates/astrid-first-owner-ceremony",
    "crates/astrid-system-generation",
    "tools/kimage",
    "tools/ktest",
    "tools/native-audit-verifier",
]
exclude = ["tools/bootloader"]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 2
panic = "abort"
lto = false
