name: Windows daemon lifecycle

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/windows-daemon-lifecycle.ps1'
      - '.github/workflows/windows-daemon-lifecycle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/windows-daemon-lifecycle.ps1'
      - '.github/workflows/windows-daemon-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native:
    name: Native lifecycle tests (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout pinned compatible CLI uplink
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: unicity-aos/aos-ce
          path: .aos-ce
          ref: f23d4672b1cef775975fcf47791da86d84160c3b
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: '1.95'
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install pinned AOS capsule toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: '1.94.0'
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: windows-daemon-lifecycle-${{ matrix.target }}
          cache-on-failure: true

      - name: Check Windows lifecycle crates
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: >-
          cargo check
          -p astrid
          -p astrid-daemon
          -p astrid-kernel
          --all-features
          --locked
          --target $env:TARGET

      - name: Lint Windows lifecycle targets
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: >-
          cargo clippy
          -p astrid
          -p astrid-daemon
          -p astrid-kernel
          --all-targets
          --all-features
          --locked
          --target $env:TARGET
          --no-deps
          --
          -D warnings

      - name: Test native CLI lifecycle decisions
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: >-
          cargo test
          -p astrid
          --locked
          --target $env:TARGET
          commands::daemon::tests

      - name: Test native process control
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: >-
          cargo test
          -p astrid
          --locked
          --target $env:TARGET
          commands::daemon_control::tests

      - name: Test unconfirmed stop exit status
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: >-
          cargo test
          -p astrid
          --locked
          --target $env:TARGET
          dispatch::tests::stop_reports_unconfirmed_exit_to_automation

      - name: Test native self-update transactions
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: >-
          cargo test
          -p astrid
          --locked
          --target $env:TARGET
          commands::self_update::windows::tests

      - name: Test shared self-update decisions
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: >-
          cargo test
          -p astrid
          --locked
          --target $env:TARGET
          commands::self_update::tests

      - name: Test native daemon runtime
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: >-
          cargo test
          -p astrid-daemon
          --locked
          --target $env:TARGET

      - name: Test native transport lifecycle
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: >-
          cargo test
          -p astrid-kernel
          --locked
          --target $env:TARGET
          socket::tests

      - name: Build native lifecycle binaries
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: >-
          cargo build
          -p astrid
          -p astrid-build
          --bin astrid
          --bin astrid-daemon
          --bin astrid-build
          --all-features
          --locked
          --target $env:TARGET

      - name: Exercise authenticated daemon lifecycle
        env:
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: >-
          ./scripts/windows-daemon-lifecycle.ps1
          -Target $env:TARGET
          -CapsuleSource "$env:GITHUB_WORKSPACE\.aos-ce\capsules\capsule-cli"

      - name: Upload lifecycle failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-daemon-lifecycle-${{ matrix.target }}
          path: ${{ runner.temp }}/windows-daemon-lifecycle-${{ matrix.target }}
          if-no-files-found: ignore
