permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux-release-smoke:
    name: Linux release smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            libc: gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            libc: gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            libc: musl
            platform: linux/amd64
            image: docker.io/library/rust@sha256:e98196986adced5602f6e21c54babdbf2a8700400c7a78868324a3630e0c5d15
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            libc: musl
            platform: linux/arm64
            image: docker.io/library/rust@sha256:594694ee6b07747b63b5c265be2616b62e814180b66227e2c18c6ee85e4136be
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build against the Linux release baseline
        if: matrix.libc == 'gnu'
        env:
          TARGET: ${{ matrix.target }}
          # Keep this digest synchronized with release.yml.
          RUST_BUILD_IMAGE: docker.io/library/rust@sha256:646e8ceea789b00c5cfa339816a3ed44940dbf1651dc167b78f3c0aefcae0025
        run: |
          SOURCE_SHA=$(git rev-parse --short=12 HEAD)
          docker run --rm \
            --env CARGO_TERM_COLOR=always \
            --env SOURCE_SHA="$SOURCE_SHA" \
            --env TARGET \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$RUST_BUILD_IMAGE" \
            bash -ceu '
              packages=(cmake)
              if [[ "$TARGET" == aarch64-unknown-linux-gnu ]]; then
                rustup target add "$TARGET"
                packages+=(gcc-aarch64-linux-gnu libc6-dev-arm64-cross)
                export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              fi
              apt-get update
              apt-get install -y --no-install-recommends "${packages[@]}"
              git config --global --add safe.directory /workspace
              [[ "$(git rev-parse --short=12 HEAD)" == "$SOURCE_SHA" ]]
              cargo build \
                --release \
                --locked \
                --target "$TARGET" \
                --target-dir target/glibc-2.31 \
                -p astrid \
                -p astrid-storage-provider-fuse
            '

      - name: Enforce the Linux glibc compatibility ceiling
        if: matrix.libc == 'gnu'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          BINARY_ROOT="target/glibc-2.31/${TARGET}/release"
          python3 scripts/check_glibc.py --max-version 2.34 \
            "$BINARY_ROOT/astrid" \
            "$BINARY_ROOT/astrid-daemon" \
            "$BINARY_ROOT/astrid-build" \
            "$BINARY_ROOT/astrid-emit" \
            "$BINARY_ROOT/astrid-storage-provider-fuse"

      - name: Build in the native Linux musl environment
        if: matrix.libc == 'musl'
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          # Platform manifest from the official Rust 1.95.0 Alpine 3.23 image.
          RUST_BUILD_IMAGE: ${{ matrix.image }}
        run: |
          SOURCE_SHA=$(git rev-parse --short=12 HEAD)
          docker run --rm \
            --platform "$PLATFORM" \
            --env CARGO_TERM_COLOR=always \
            --env SOURCE_SHA="$SOURCE_SHA" \
            --env TARGET \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$RUST_BUILD_IMAGE" \
            sh -ceu '
              apk add --no-cache binutils build-base cmake git perl pkgconf python3
              git config --global --add safe.directory /workspace
              [ "$(git rev-parse --short=12 HEAD)" = "$SOURCE_SHA" ]
              cargo build \
                --release \
                --locked \
                --target "$TARGET" \
                --target-dir target/musl \
                -p astrid \
                -p astrid-storage-provider-fuse
              BINARY_ROOT="target/musl/$TARGET/release"
              ARCHITECTURE="${TARGET%%-*}"
              python3 scripts/check_static_elf.py --architecture "$ARCHITECTURE" \
                "$BINARY_ROOT/astrid" \
                "$BINARY_ROOT/astrid-daemon" \
                "$BINARY_ROOT/astrid-build" \
                "$BINARY_ROOT/astrid-emit" \
                "$BINARY_ROOT/astrid-storage-provider-fuse"
            '

      - name: Exercise the Linux musl binaries
        if: matrix.libc == 'musl'
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          RUST_BUILD_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --platform "$PLATFORM" \
            --env TARGET \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$RUST_BUILD_IMAGE" \
            sh -ceu '
              for binary in astrid astrid-daemon astrid-build astrid-emit; do
                "target/musl/$TARGET/release/$binary" --version
              done
            '

  linux-v0104-upgrade:
    name: Published v0.10.4 Linux upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95.0"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          cache-on-failure: true

      - name: Build the current upgrade binaries
        run: cargo build --locked -p astrid --bins

      - name: Upgrade the pinned published Linux release
        run: scripts/test_v0104_linux_upgrade.sh

  linux-fuse-e2e:
    name: Linux native FUSE E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ASTRID_FUSE_E2E: "1"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95.0"

      - name: Install and require native FUSE support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev
          if [[ ! -c /dev/fuse ]]; then
            sudo modprobe fuse
          fi
          [[ -c /dev/fuse ]] || { echo "::error::hosted runner has no Linux FUSE device" >&2; exit 1; }
          command -v fusermount3 >/dev/null || { echo "::error::hosted runner has no fusermount3" >&2; exit 1; }
          sudo chmod 0666 /dev/fuse

      - name: Exercise the real Linux mount
        run: >
          cargo test --locked -p astrid-storage-provider-fuse
          linux_native_fuse_mount_supports_all_required_operations --
          --ignored --nocapture

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          cache-on-failure: true

      - name: Run cargo check
        run: cargo check --workspace --all-features --locked

      - name: Test release manifest contract
        run: scripts/ci/test-release-contracts.sh

  wasm-portability:
    name: Wasm portability
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          cache-on-failure: true

      - name: Check wasm32 portability of kernel semantics crates
        run: ./scripts/check-wasm-portability.sh

  windows-filesystem-native:
    name: Windows filesystem native tests (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: windows-filesystem-${{ matrix.target }}
          cache-on-failure: true

      - name: Run the filesystem prerequisite tests natively
        shell: pwsh
        run: cargo test --locked --target ${{ matrix.target }} -p astrid-core platform_fs -- --nocapture

      - name: Parse the Windows install scripts
        shell: pwsh
        run: |
          $contents = @{}
          foreach ($script in "scripts/install-windows.ps1", "scripts/uninstall-windows.ps1") {
            $contents[$script] = Get-Content -LiteralPath $script -Raw
            $null = [scriptblock]::Create($contents[$script])
          }
          foreach ($variable in "WinFspMsi", "WinFspSha256") {
            $pattern = '(?m)^\${0} = "([^"]+)"\r?$' -f [regex]::Escape($variable)
            $installPin = [regex]::Match($contents["scripts/install-windows.ps1"], $pattern)
            $uninstallPin = [regex]::Match($contents["scripts/uninstall-windows.ps1"], $pattern)
            if (-not $installPin.Success -or -not $uninstallPin.Success -or
                $installPin.Groups[1].Value -ne $uninstallPin.Groups[1].Value) {
              throw "Windows install and uninstall scripts disagree on $variable"
            }
          }

      - name: Reject a tampered Windows uninstall marker
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP "astrid-uninstall-marker-test"
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          @{ product = "astrid"; winfsp_installed_by_astrid = $false; winfsp_installer = "..\outside.txt" } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $install "astrid-install.json")
          $outside = Join-Path $env:RUNNER_TEMP "outside.txt"
          Set-Content -LiteralPath $outside -Value "keep"
          try {
            & scripts/uninstall-windows.ps1 -InstallDir $install
            throw "tampered uninstall marker was accepted"
          } catch {
            if ($_.Exception.Message -eq "tampered uninstall marker was accepted") { throw }
          }
          if (-not (Test-Path -LiteralPath $outside -PathType Leaf)) {
            throw "tampered uninstall marker removed an external file"
          }

      - name: Reject a tampered cached WinFsp installer
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP "astrid-uninstall-msi-test"
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          @{ product = "astrid"; winfsp_installed_by_astrid = $true; winfsp_installer = "winfsp-2.1.25156.msi" } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $install "astrid-install.json")
          $msi = Join-Path $install "winfsp-2.1.25156.msi"
          Set-Content -LiteralPath $msi -Value "not the pinned WinFsp installer"
          try {
            & scripts/uninstall-windows.ps1 -InstallDir $install -RemoveWinFsp
            throw "tampered cached WinFsp installer was accepted"
          } catch {
            if ($_.Exception.Message -eq "tampered cached WinFsp installer was accepted") { throw }
            if ($_.Exception.Message -notlike "Cached WinFsp installer digest mismatch:*") { throw }
          }
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $install "astrid-install.json") -PathType Leaf)) {
            throw "tampered MSI rejection mutated the installation"
          }

      - name: Install pinned WinFsp runtime
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "winfsp-2.1.25156.msi"
          Invoke-WebRequest `
            -Uri "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" `
            -OutFile $msi
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash
          if ($hash -ne "073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A") {
            throw "WinFsp MSI digest mismatch: $hash"
          }
          $exitCode = (Start-Process -FilePath "msiexec.exe" `
            -ArgumentList @("/i", "`"$msi`"", "ADDLOCAL=F.Developer", "/qn", "/norestart") `
            -Wait -PassThru).ExitCode
          if ($exitCode -ne 0 -and $exitCode -ne 3010) {
            throw "WinFsp installation failed with exit code $exitCode"
          }
          $importLibrary = Join-Path ${env:ProgramFiles(x86)} "WinFsp\lib\winfsp-x64.lib"
          if (-not (Test-Path -LiteralPath $importLibrary -PathType Leaf)) {
            throw "WinFsp Developer import library was not installed: $importLibrary"
          }
          $registry = Get-ItemProperty -LiteralPath "HKLM:\SOFTWARE\WOW6432Node\WinFsp" -ErrorAction Stop
          if ([string]::IsNullOrWhiteSpace($registry.InstallDir)) {
            throw "WinFsp installation did not publish InstallDir"
          }
          $runtimeLibrary = Join-Path $registry.InstallDir "bin\winfsp-x64.dll"
          if (-not (Test-Path -LiteralPath $runtimeLibrary -PathType Leaf)) {
            throw "WinFsp x64 runtime DLL was not installed: $runtimeLibrary"
          }

      - name: Lint the Windows provider
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: >-
          cargo clippy --locked --target ${{ matrix.target }}
          -p astrid-storage-provider-winfsp --all-targets -- -D warnings

      - name: Lint the Windows CLI updater
        shell: pwsh
        run: >-
          cargo clippy --locked --target ${{ matrix.target }} -p astrid
          --bin astrid -- -D warnings

      - name: Run portable WinFsp provider tests natively
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: cargo test --locked --target ${{ matrix.target }} -p astrid-storage-provider-winfsp -- --nocapture

      - name: Run Windows updater tests natively
        shell: pwsh
        run: >-
          cargo test --locked --target ${{ matrix.target }} -p astrid
          --bin astrid commands::self_update -- --nocapture

      - name: Run local transport security tests natively
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: >-
          cargo test --locked --target ${{ matrix.target }} -p astrid-core
          local_transport -- --nocapture --test-threads=1

      - name: Run storage callback transport tests natively
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: >-
          cargo test --locked --target ${{ matrix.target }} -p astrid-kernel
          storage_mount -- --nocapture --test-threads=1

      - name: Run the native WinFsp filesystem round trip
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          ASTRID_WINFSP_NATIVE_TEST: "1"
        shell: pwsh
        run: >-
          cargo test --locked --target ${{ matrix.target }}
          -p astrid-storage-provider-winfsp -- --nocapture --test-threads=1

      - name: Run layout migration policy tests natively
        shell: pwsh
        run: cargo test --locked --target ${{ matrix.target }} -p astrid-core dirs::tests -- --nocapture

      - name: Check the typed storage-provider handoff natively
        shell: pwsh
        run: >-
          cargo test
          --locked
          --target ${{ matrix.target }}
          -p astrid
          --bin astrid
          commands::storage::tests
          --
          --nocapture

      - name: Run fresh runtime signing provisioning natively
        shell: pwsh
        run: >-
          cargo test
          --locked
          --target ${{ matrix.target }}
          -p astrid-build
          runtime_signing
          --
          --nocapture

      - name: Run fresh capsule-install provisioning natively
        shell: pwsh
        run: >-
          cargo test
          --locked
          --target ${{ matrix.target }}
          -p astrid-capsule-install
          --test install
          fresh_private_windows_home
          --
          --nocapture

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95"
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95"
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          cache-on-failure: true

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # The astrid-capsule test binary statically links the entire dependency
      # tree (wasmtime, aws-lc, ring, surrealkv, ...). With full debug info the
      # final link exhausts the runner and the linker dies (collect2/lld SIGBUS
      # / SIGABRT). Strip debug info for the test build only — debuginfo is the
      # dominant contributor to both linker peak memory and target/ disk. This
      # is CI-scoped via Cargo profile env overrides; local and dev builds keep
      # full debug info. See #954.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          cache-on-failure: true

      - name: Validate the native macOS FSKit provider
        if: matrix.os == 'macos-latest'
        env:
          ASTRID_FSKIT_VALIDATE_PROJECT: "1"
        run: scripts/check-macos-fskit.sh

      - name: Validate macOS packaging and lifecycle scripts
        if: matrix.os == 'macos-latest'
        run: |
          bash -n scripts/build-macos-fskit.sh \
            scripts/check-macos-fskit.sh \
            scripts/manage-macos-fskit.sh \
            scripts/test_manage_macos_fskit.sh \
            scripts/validate-macos-fskit.sh \
            scripts/test_v0104_macos_upgrade.sh
          python3 -m unittest scripts/test_macos_release_packaging.py
          scripts/test_manage_macos_fskit.sh

      - name: Run tests
        if: matrix.os != 'macos-latest'
        run: cargo test --workspace --locked

      - name: Run tests (macOS serial)
        if: matrix.os == 'macos-latest'
        env:
          RUST_BACKTRACE: full
        run: scripts/ci/test-workspace-macos.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          toolchain: "1.95"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          cache-on-failure: true

      - name: Check MSRV compiles
        run: cargo check --workspace --locked

  api-compatibility:
    # Keep this check name stable for branch-protection compatibility.
    name: Public API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect core Rust API inputs
        id: api-inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA"...HEAD | tee changed-files.txt

          if grep -Eq '(^Cargo\.toml$|^crates/[^/]+/Cargo\.toml$|^crates/[^/]+/src/.*\.rs$|^crates/[^/]+/build\.rs$|^crates/[^/]+/wit/|^wit/)' changed-files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Core Rust API inputs changed; running cargo-semver-checks."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No core Rust API inputs changed; skipping cargo-semver-checks."
          fi

          new_packages=""
          while IFS= read -r manifest; do
            if ! package=$(python3 -c \
              'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["name"])' \
              "$manifest") || [ -z "$package" ]; then
              echo "::error file=$manifest::New workspace package has no parseable package name."
              exit 1
            fi
            new_packages="${new_packages:+$new_packages,}$package"
          done < <(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- 'crates/*/Cargo.toml')
          echo "new-packages=$new_packages" >> "$GITHUB_OUTPUT"
          echo "internal-excludes=$new_packages" >> "$GITHUB_OUTPUT"
          if [ -n "$new_packages" ]; then
            echo "New packages have no baseline API and will be excluded: $new_packages"
          fi

      - name: Install Rust toolchain
        if: steps.api-inputs.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95"

      - name: Cache Rust artifacts
        if: steps.api-inputs.outputs.run == 'true'
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          cache-on-failure: true

      - name: Install cargo-semver-checks for core report
        id: install-internal-semver
        if: always() && steps.api-inputs.outputs.run == 'true'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-semver-checks

      - name: Report core crate API compatibility
        id: internal-semver
        if: always() && steps.api-inputs.outputs.run == 'true' && steps.install-internal-semver.outcome == 'success'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INTERNAL_EXCLUDES: ${{ steps.api-inputs.outputs.internal-excludes }}
          CARGO_TARGET_DIR: semver-checks/target
        run: scripts/ci/report-core-api-compatibility.sh

      - name: Summarize Rust API compatibility policy
        if: always() && steps.api-inputs.outputs.run == 'true'
        env:
          INTERNAL_OUTCOME: ${{ steps.internal-semver.outcome }}
          INTERNAL_RESULT: ${{ steps.internal-semver.outputs.result }}
        run: |
          result="${INTERNAL_RESULT:-not-run}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Rust API compatibility

          Core workspace libraries, including \`astrid-types\`, are implementation details rather than separately supported products. Their semver findings remain visible for maintainer review, but are advisory so automation cannot force architecture changes merely to preserve an internal Rust surface.

          Tool, compiler, and workflow failures still fail this job. Astrid's supported compatibility boundaries are enforced by the CLI, WIT/wire, runtime, security, portability, and platform checks.

          Core library check result: **$result** (step outcome: **$INTERNAL_OUTCOME**). See #1480 for the publication policy.
          EOF

  public-rust-api-diff:
    # Keep this check name stable for branch-protection compatibility.
    name: Public Rust API diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect core Rust API inputs
        id: api-inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA"...HEAD | tee changed-files.txt

          if grep -Eq '(^Cargo\.toml$|^crates/[^/]+/Cargo\.toml$|^crates/[^/]+/src/.*\.rs$|^crates/[^/]+/build\.rs$|^crates/[^/]+/wit/|^wit/)' changed-files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Core Rust API inputs changed; running cargo-public-api."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No core Rust API inputs changed; skipping cargo-public-api."
          fi

      - name: Install Rust toolchains
        if: steps.api-inputs.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly-2026-06-29

      - name: Cache Rust artifacts
        if: steps.api-inputs.outputs.run == 'true'
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          cache-on-failure: true

      - name: Install cargo-public-api
        if: steps.api-inputs.outputs.run == 'true'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-public-api

      - name: Report Rust item diff
        if: steps.api-inputs.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/report-public-rust-api-diff.sh

  gateway-openapi-contract:
    name: Gateway OpenAPI contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: .openapi-target
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect gateway contract inputs
        id: gateway-inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA"...HEAD | tee changed-files.txt

          if grep -Eq '(^Cargo\.toml$|^Cargo\.lock$|^crates/astrid-gateway/Cargo\.toml$|^crates/astrid-gateway/src/|^crates/astrid-gateway/examples/print-openapi\.rs$)' changed-files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Gateway contract inputs changed; diffing OpenAPI specs."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No gateway contract inputs changed; skipping OpenAPI diff."
          fi

      - name: Install Rust toolchain
        if: steps.gateway-inputs.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95"

      - name: Cache Rust artifacts
        if: steps.gateway-inputs.outputs.run == 'true'
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          workspaces: |
            . -> .openapi-target
          cache-on-failure: true

      - name: Detect OpenAPI contract-change marker
        if: steps.gateway-inputs.outputs.run == 'true'
        id: openapi-contract-change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git log --format=%B "$BASE_SHA..$HEAD_SHA" \
            | grep -Eq '^(OPENAPI|API)[ -]CONTRACT[ -]CHANGE:'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "OpenAPI contract-change marker found; generated diff will be reported without denying the PR."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No OpenAPI contract-change marker found; generated diff will deny the PR."
          fi

      - name: Diff generated OpenAPI spec
        if: steps.gateway-inputs.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENAPI_CONTRACT_CHANGE: ${{ steps.openapi-contract-change.outputs.found }}
        run: scripts/ci/diff-gateway-openapi.sh

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify lockfile
        run: cargo metadata --locked --no-deps > /dev/null

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
