name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'
      - '!v[0-9]+.*-nightly.*'
  workflow_dispatch:
    inputs:
      prepare_only:
        description: Build Darwin binaries without certification or publication
        required: false
        default: false
        type: boolean
      source_commit:
        description: Exact protected-main commit to build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: astrid-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  classify:
    name: Classify release lane
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      nightly: ${{ steps.release.outputs.nightly }}
      version: ${{ steps.release.outputs.version }}
      source-commit: ${{ steps.release.outputs.source-commit }}
      build-matrix: ${{ steps.release.outputs.build-matrix }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Bind event, tag, and source commit
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREPARE_ONLY: ${{ inputs.prepare_only }}
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_MATRIX=$(python3 scripts/classify_release_build_matrix.py)
          if [[ "$EVENT_NAME" == workflow_dispatch && "$PREPARE_ONLY" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]]
            [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$REQUESTED_SOURCE" origin/main
            git checkout --detach --force "$REQUESTED_SOURCE"
            [[ "$(git rev-parse 'HEAD^{commit}')" == "$REQUESTED_SOURCE" ]]
            VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
            SOURCE_COMMIT="$REQUESTED_SOURCE"
            NIGHTLY=false
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SOURCE_COMMIT=$(git rev-parse 'HEAD^{commit}')
            if [[ "$EVENT_NAME" == push ]]; then
              [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              NIGHTLY=false
            elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
              NIGHTLY_DATE="${VERSION#*-nightly.}"
              NIGHTLY_DATE="${NIGHTLY_DATE%%.g*}"
              RUN_CREATED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
              python3 scripts/nightly_version.py validate-dispatch \
                --date "$NIGHTLY_DATE" \
                --created-at "$RUN_CREATED_AT"
              EXPECTED=$(python3 scripts/nightly_version.py derive \
                --date "$NIGHTLY_DATE" \
                --source-commit "$SOURCE_COMMIT")
              [[ "$VERSION" == "$EXPECTED" ]]
              git fetch --no-tags origin main
              git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
              NIGHTLY=true
            else
              echo "unsupported release event: $EVENT_NAME" >&2
              exit 1
            fi
          else
            echo "unsupported release event: $EVENT_NAME" >&2
            exit 1
          fi
          {
            echo "nightly=$NIGHTLY"
            echo "version=$VERSION"
            echo "source-commit=$SOURCE_COMMIT"
            echo "build-matrix=$BUILD_MATRIX"
          } >> "$GITHUB_OUTPUT"

  # ── Build binaries for each platform ──────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: classify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.build-matrix) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.source-commit }}
          # astrid-capsule's build.rs stages WIT files from the
          # `wit/` submodule (astrid-runtime/wit) before bindgen
          # consumes them. Without recursive submodule checkout the
          # release build fails with `read wit/host: No such file or
          # directory`. Matches the ci.yml fix landed in #752.
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Refuse a nightly after its canonical base is tagged
        if: needs.classify.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_VERSION=$(python3 - <<'PY'
          import tomllib
          with open("release/nightly.toml", "rb") as file:
              print(tomllib.load(file)["base-version"])
          PY
          )
          BASE_REFS="$RUNNER_TEMP/canonical-base-refs.json"
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$BASE_VERSION" > "$BASE_REFS"
          if ! jq -e --arg ref "refs/tags/v$BASE_VERSION" 'all(.ref != $ref)' "$BASE_REFS" >/dev/null; then
            echo "canonical v$BASE_VERSION was tagged while this nightly waited for approval" >&2
            exit 1
          fi

      - name: Stage deterministic nightly version
        if: needs.classify.outputs.nightly == 'true'
        run: python3 scripts/nightly_version.py stage --version "${GITHUB_REF_NAME#v}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # MUST match rust-toolchain.toml's channel EXACTLY (incl. patch).
          # rustup treats "1.95" and "1.95.0" as distinct toolchains: the
          # action adds `targets` to the toolchain it installs, but the build
          # uses the one rust-toolchain.toml pins. A mismatch installs the
          # cross-target std onto the wrong toolchain, so cross builds fail with
          # `error[E0463]: can't find crate for core/std`. Native builds escape
          # it because the host std ships with every toolchain by default.
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: matrix.libc == 'native'
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries (native)
        if: matrix.libc == 'native'
        run: cargo build --release --target ${{ matrix.target }} -p astrid --locked

      - name: Build and validate the macOS FSKit companion
        if: contains(matrix.target, 'apple-darwin')
        env:
          ASTRID_FSKIT_VALIDATE_PROJECT: "1"
          ASTRID_FSKIT_ARCHS: ${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'arm64' }}
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p astrid-storage-provider-fskit --locked
          scripts/check-macos-fskit.sh

      - name: Build, sign, and notarize AstridFS
        if: contains(matrix.target, 'apple-darwin')
        env:
          ASTRID_MACOS_DEVELOPMENT_TEAM_ID: ${{ secrets.ASTRID_MACOS_DEVELOPMENT_TEAM_ID }}
          ASTRID_MACOS_DEVELOPER_ID_P12: ${{ secrets.ASTRID_MACOS_DEVELOPER_ID_P12 }}
          ASTRID_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.ASTRID_MACOS_DEVELOPER_ID_P12_PASSWORD }}
          ASTRID_MACOS_NOTARY_APPLE_ID: ${{ secrets.ASTRID_MACOS_NOTARY_APPLE_ID }}
          ASTRID_MACOS_NOTARY_APP_PASSWORD: ${{ secrets.ASTRID_MACOS_NOTARY_APP_PASSWORD }}
          ASTRID_FSKIT_CODE_SIGN_IDENTITY: ${{ vars.ASTRID_MACOS_DEVELOPER_ID_IDENTITY || 'Developer ID Application' }}
          ASTRID_FSKIT_ARCHS: ${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'arm64' }}
          ASTRID_FSKIT_NOTARIZE: "1"
          ASTRID_FSKIT_NOTARY_KEY_ID: ${{ secrets.ASTRID_MACOS_NOTARY_KEY_ID }}
          ASTRID_FSKIT_NOTARY_ISSUER_ID: ${{ secrets.ASTRID_MACOS_NOTARY_ISSUER_ID }}
          ASTRID_FSKIT_NOTARY_KEY: ${{ secrets.ASTRID_MACOS_NOTARY_KEY }}
        run: |
          scripts/ci/import_macos_signing.sh
          echo "ASTRID_FSKIT_APP=$PWD/target/macos-fskit/DerivedData/Build/Products/Release/AstridFS.app" >> "$GITHUB_ENV"

      - name: Sign the macOS FSKit companion
        if: contains(matrix.target, 'apple-darwin')
        env:
          ASTRID_MACOS_DEVELOPMENT_TEAM_ID: ${{ secrets.ASTRID_MACOS_DEVELOPMENT_TEAM_ID }}
          ASTRID_MACOS_DEVELOPER_ID_P12: ${{ secrets.ASTRID_MACOS_DEVELOPER_ID_P12 }}
          ASTRID_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.ASTRID_MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_IDENTITY: ${{ vars.ASTRID_MACOS_DEVELOPER_ID_IDENTITY }}
        run: |
          set -euo pipefail
          COMPANION_TEAM=9BDSL5BJAP
          COMPANION_IDENTIFIER=org.astrid.runtime.fs.storage-provider-fskit
          COMPANION="$PWD/target/${{ matrix.target }}/release/astrid-storage-provider-fskit"
          [[ -f "$COMPANION" && -x "$COMPANION" ]]
          IDENTITY="${MACOS_DEVELOPER_ID_IDENTITY:-Developer ID Application}"
          scripts/ci/import_macos_signing.sh --identity-only \
            codesign --force --options runtime --timestamp \
              --identifier "$COMPANION_IDENTIFIER" \
              --sign "$IDENTITY" "$COMPANION"
          COMPANION_SIGNATURE="$(codesign --display --verbose=4 "$COMPANION" 2>&1)"
          grep -Fx "Identifier=$COMPANION_IDENTIFIER" <<<"$COMPANION_SIGNATURE" >/dev/null
          grep -Fx "TeamIdentifier=$COMPANION_TEAM" <<<"$COMPANION_SIGNATURE" >/dev/null
          codesign --verify --strict --verbose=2 "$COMPANION"

      - name: Select native binary root
        if: matrix.libc == 'native'
        run: echo "BINARY_ROOT=target/${{ matrix.target }}/release" >> "$GITHUB_ENV"

      - name: Build Linux binaries against the glibc 2.31 baseline
        if: matrix.libc == 'gnu'
        env:
          TARGET: ${{ matrix.target }}
          # Official Rust 1.95.0 Bullseye image, linux/amd64 manifest.
          RUST_BUILD_IMAGE: docker.io/library/rust@sha256:646e8ceea789b00c5cfa339816a3ed44940dbf1651dc167b78f3c0aefcae0025
        run: |
          SOURCE_SHA=$(git rev-parse --short=12 HEAD)
          docker run --rm \
            --env CARGO_TERM_COLOR=always \
            --env SOURCE_SHA="$SOURCE_SHA" \
            --env TARGET \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$RUST_BUILD_IMAGE" \
            bash -ceu '
              packages=(cmake)
              if [[ "$TARGET" == aarch64-unknown-linux-gnu ]]; then
                rustup target add "$TARGET"
                packages+=(gcc-aarch64-linux-gnu libc6-dev-arm64-cross)
                export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              fi
              apt-get update
              apt-get install -y --no-install-recommends "${packages[@]}"
              git config --global --add safe.directory /workspace
              [[ "$(git rev-parse --short=12 HEAD)" == "$SOURCE_SHA" ]]
              cargo build \
                --release \
                --locked \
                --target "$TARGET" \
                --target-dir target/glibc-2.31 \
                -p astrid \
                -p astrid-storage-provider-fuse
            '
          echo "BINARY_ROOT=target/glibc-2.31/${TARGET}/release" >> "$GITHUB_ENV"

      - name: Enforce the Linux glibc compatibility ceiling
        if: matrix.libc == 'gnu'
        run: |
          python3 scripts/check_glibc.py --max-version 2.34 \
            "$BINARY_ROOT/astrid" \
            "$BINARY_ROOT/astrid-daemon" \
            "$BINARY_ROOT/astrid-build" \
            "$BINARY_ROOT/astrid-emit" \
            "$BINARY_ROOT/astrid-storage-provider-fuse"

      - name: Build in the native Linux musl environment
        if: matrix.libc == 'musl'
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          # Platform manifest from the official Rust 1.95.0 Alpine 3.23 image.
          RUST_BUILD_IMAGE: ${{ matrix.image }}
        run: |
          SOURCE_SHA=$(git rev-parse --short=12 HEAD)
          docker run --rm \
            --platform "$PLATFORM" \
            --env CARGO_TERM_COLOR=always \
            --env SOURCE_SHA="$SOURCE_SHA" \
            --env TARGET \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$RUST_BUILD_IMAGE" \
            sh -ceu '
              apk add --no-cache binutils build-base cmake git perl pkgconf python3
              git config --global --add safe.directory /workspace
              [ "$(git rev-parse --short=12 HEAD)" = "$SOURCE_SHA" ]
              cargo build \
                --release \
                --locked \
                --target "$TARGET" \
                --target-dir target/musl \
                -p astrid \
                -p astrid-storage-provider-fuse
              BINARY_ROOT="target/musl/$TARGET/release"
              ARCHITECTURE="${TARGET%%-*}"
              python3 scripts/check_static_elf.py --architecture "$ARCHITECTURE" \
                "$BINARY_ROOT/astrid" \
                "$BINARY_ROOT/astrid-daemon" \
                "$BINARY_ROOT/astrid-build" \
                "$BINARY_ROOT/astrid-emit" \
                "$BINARY_ROOT/astrid-storage-provider-fuse"
            '
          echo "BINARY_ROOT=target/musl/${TARGET}/release" >> "$GITHUB_ENV"

      - name: Exercise the Linux musl binaries
        if: matrix.libc == 'musl'
        env:
          PLATFORM: ${{ matrix.platform }}
          RUST_BUILD_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --platform "$PLATFORM" \
            --env BINARY_ROOT \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$RUST_BUILD_IMAGE" \
            sh -ceu '
              for binary in astrid astrid-daemon astrid-build astrid-emit; do
                "$BINARY_ROOT/$binary" --version
              done
            '

      - name: Package binaries
        shell: bash
        env:
          VERSION: ${{ needs.classify.outputs.version }}
        run: |
          TARGET="${{ matrix.target }}"
          DIR="astrid-${VERSION}-${{ matrix.target }}"
          mkdir "$DIR"
          EXE=""
          cp "$BINARY_ROOT/astrid$EXE" "$DIR/"
          cp "$BINARY_ROOT/astrid-daemon$EXE" "$DIR/"
          cp "$BINARY_ROOT/astrid-build$EXE" "$DIR/"
          cp "$BINARY_ROOT/astrid-emit$EXE" "$DIR/"
          cp LICENSE* README.md "$DIR/" 2>/dev/null || true
          if [[ "$TARGET" == *-apple-darwin ]]; then
            cp "$BINARY_ROOT/astrid-storage-provider-fskit" "$DIR/"
            ditto "$ASTRID_FSKIT_APP" "$DIR/AstridFS.app"
            mkdir "$DIR/macos"
            cp scripts/manage-macos-fskit.sh "$DIR/macos/"
            cp scripts/validate-macos-fskit.sh "$DIR/macos/"
            cp LICENSE* README.md "$DIR/" 2>/dev/null || true
            SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
            python3 scripts/package_release_archive.py \
              --root "$DIR" \
              --output "${DIR}.tar.gz" \
              --mtime "$SOURCE_DATE_EPOCH"
            python3 scripts/validate_macos_release.py "${DIR}.tar.gz" \
              --mtime "$SOURCE_DATE_EPOCH"
            EXTRACTION="$RUNNER_TEMP/validate-astrid-release"
            rm -rf "$EXTRACTION"
            mkdir -p "$EXTRACTION"
            tar -xzf "${DIR}.tar.gz" -C "$EXTRACTION"
            export ASTRID_FSKIT_EXPECTED_VERSION="$VERSION"
            scripts/validate-macos-fskit.sh "$EXTRACTION/$DIR/AstridFS.app"
          else
            if [[ "$TARGET" == *-unknown-linux-* ]]; then
              cp "$BINARY_ROOT/astrid-storage-provider-fuse" "$DIR/"
            fi
            tar czf "${DIR}.tar.gz" "$DIR"
            python3 scripts/validate_release_archive.py "${DIR}.tar.gz" \
              --target "$TARGET"
          fi
          echo "ASSET=${DIR}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ASSET }}

  fskit-certification:
    name: Native FSKit mount certification
    needs: [classify, build]
    if: ${{ !inputs.prepare_only }}
    uses: ./.github/workflows/native-storage-certification.yml
    permissions:
      contents: read
      actions: read
    with:
      source_commit: ${{ needs.classify.outputs.source-commit }}
      runner_contract_acknowledged: true
      consume_same_run_artifacts: true

  # ── Create the GitHub release with all binaries ───────────────────
  github-release:
    name: GitHub Release
    needs: [classify, build, fskit-certification]
    if: ${{ !inputs.prepare_only }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Require repository immutable releases
        env:
          GH_TOKEN: ${{ secrets.ASTRID_RELEASE_ADMIN_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]]
          gh api "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq 'select(.enabled == true) | true' | grep -Fx true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Stage deterministic nightly version
        if: needs.classify.outputs.nightly == 'true'
        run: python3 scripts/nightly_version.py stage --version "${GITHUB_REF_NAME#v}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95.0"

      - name: Install pinned b3sum
        run: cargo install b3sum --version 1.8.5 --locked

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      # The whole notes document is assembled into a FILE and handed to the
      # release action via `body_path`. An inline `body:` input reaches the
      # action as an environment variable on its node process, and a large
      # changelog section blows past the kernel's per-string env/arg ceiling
      # (E2BIG, "Argument list too long") before the step can even start —
      # exactly what killed the v0.9.0 release (#1105).
      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ needs.classify.outputs.nightly }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=release-notes.md
          # Exact-prefix match on the version header — the version goes in as a
          # string, never a regex, so dots (or any metacharacter in a tag name)
          # cannot widen the match. Fragments must already be rolled into
          # CHANGELOG.md; this step refuses leftover files in changes/.
          python3 scripts/changelog.py notes --version "$VERSION" --require-rolled > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "See [CHANGELOG.md](https://github.com/astrid-runtime/astrid/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for details." > "$NOTES"
          fi
          cat >> "$NOTES" <<'INSTALL'

          ## Install
          INSTALL

          if [[ "$NIGHTLY" == true ]]; then
            cat >> "$NOTES" <<'INSTALL'

          Nightly releases are available only as signed pre-built binaries and
          through `astrid update --channel nightly`. They are not published to
          crates.io or Homebrew.
          INSTALL
          else
            cat >> "$NOTES" <<'INSTALL'

          **From source (requires Rust 1.95+):**
          ```
          cargo install astrid
          ```
          INSTALL
          fi

          cat >> "$NOTES" <<'INSTALL'

          **Linux pre-built archive:**
          ```
          tar xzf astrid-*-$(uname -m)-unknown-linux-*.tar.gz
          sudo install -m 0755 astrid-*/astrid astrid-*/astrid-daemon \
            astrid-*/astrid-build astrid-*/astrid-emit \
            astrid-*/astrid-storage-provider-fuse /usr/local/bin/
          ```

          **macOS pre-built archive and signed AstridFS app:**
          ```
          ARCH=$(uname -m); [[ "$ARCH" == arm64 ]] && ARCH=aarch64
          tar xzf astrid-*-${ARCH}-apple-darwin.tar.gz
          sudo install -m 0755 astrid-*/astrid astrid-*/astrid-daemon \
            astrid-*/astrid-build astrid-*/astrid-emit /usr/local/bin/
          astrid-*/macos/manage-macos-fskit.sh install
          astrid-*/macos/manage-macos-fskit.sh enable
          ```

          Astrid Runtime does not bundle a product distro. To compose it with a
          distro you trust, run:
          ```
          astrid init --distro <name, @org/repo, path, or .shuttle>
          ```

          ---

          **With many thanks from the following Astrinauts** 🚀

          INSTALL
          PREV_TAG=$(git tag --merged HEAD --sort=-v:refname \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | grep -Fvx "$GITHUB_REF_NAME" \
            | sed -n '1p' || true)
          if [ -z "$PREV_TAG" ]; then
            AUTHORS=$(git log --format='%aN' | sort -u)
          else
            AUTHORS=$(git log --format='%aN' "$PREV_TAG"..HEAD | sort -u)
          fi
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            EMAIL=$(git log --format='%aE' --author="$name" -1)
            USERNAME=$(gh api "search/users?q=$EMAIL+in:email" --jq '.items[0].login // empty' 2>/dev/null || true)
            # A failed lookup must fall back to the plain author name, never
            # leak whatever stdout produced (the v0.9.0 run interpolated a raw
            # 422 error JSON as a contributor) — accept only a well-formed
            # GitHub login.
            if printf '%s' "$USERNAME" | grep -qE '^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$' \
               && ! printf '%s' "$USERNAME" | grep -q -- '--'; then
              echo "- @${USERNAME}" >> "$NOTES"
            else
              echo "- ${name}" >> "$NOTES"
            fi
          done <<< "$AUTHORS"

      - name: Generate checksums
        run: |
          cd artifacts
          b3sum -- ./*.tar.gz | sed 's#  \./#  #' > BLAKE3SUMS.txt
          sha256sum -- ./*.tar.gz | sed 's#  \./#  #' > SHA256SUMS.txt
          b3sum --check BLAKE3SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat BLAKE3SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate immutable release manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "$VERSION" = "$CARGO_VERSION"
          if compgen -G "artifacts/*x86_64-pc-windows-msvc*" >/dev/null || \
            compgen -G "artifacts/astrid-*-windows-release.toml*" >/dev/null || \
            grep -Eq 'x86_64-pc-windows-msvc' \
              artifacts/BLAKE3SUMS.txt artifacts/SHA256SUMS.txt; then
            echo "stable release rejects Windows archives and Windows metadata" >&2
            exit 1
          fi
          SOURCE_COMMIT=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          CONTRACTS_COMMIT=$(git -C wit rev-parse HEAD)
          python3 scripts/release_manifest.py generate \
            --artifacts artifacts \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$SOURCE_COMMIT" \
            --contracts-commit "$CONTRACTS_COMMIT" \
            --output "artifacts/astrid-${VERSION}-release.toml"
          python3 scripts/release_manifest.py validate \
            "artifacts/astrid-${VERSION}-release.toml" \
            --artifacts artifacts \
            --verify-artifacts
          python3 scripts/musl_release_manifest.py generate \
            --artifacts artifacts \
            --legacy-manifest "artifacts/astrid-${VERSION}-release.toml" \
            --output "artifacts/astrid-${VERSION}-musl-release.toml"
          python3 scripts/musl_release_manifest.py validate \
            "artifacts/astrid-${VERSION}-musl-release.toml" \
            --legacy-manifest "artifacts/astrid-${VERSION}-release.toml" \
            --artifacts artifacts \
            --verify-artifacts
          {
            echo "VERSION=$VERSION"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "CONTRACTS_COMMIT=$CONTRACTS_COMMIT"
          } >> "$GITHUB_ENV"

      - name: Detect an interrupted never-published draft
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRERELEASE: ${{ needs.classify.outputs.nightly }}
        run: |
          RELEASES="$RUNNER_TEMP/releases-preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp > "$RELEASES"
          MATCH_COUNT=$(jq -er --arg tag "$GITHUB_REF_NAME" \
            '[.[][] | select(.tag_name == $tag)] | length' "$RELEASES")
          [[ "$MATCH_COUNT" -le 1 ]]
          if [[ "$MATCH_COUNT" == 0 ]]; then
            echo "EXISTING_RELEASE=0" >> "$GITHUB_ENV"
            exit 0
          fi
          jq -e --arg tag "$GITHUB_REF_NAME" --argjson prerelease "$EXPECTED_PRERELEASE" \
            '.[][] | select(.tag_name == $tag) | select(.draft == true and .prerelease == $prerelease and .published_at == null)' \
            "$RELEASES" >/dev/null || {
            echo "release $GITHUB_REF_NAME already exists and is not a never-published draft" >&2
            echo "release assets are write-once; never clobber, delete, or retag a published version" >&2
            exit 1
          }
          echo "EXISTING_RELEASE=1" >> "$GITHUB_ENV"

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/BLAKE3SUMS.txt
            artifacts/SHA256SUMS.txt
            artifacts/astrid-*-release.toml

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets
        env:
          COSIGN_YES: "true"
        run: |
          cd artifacts
          for asset in *.tar.gz BLAKE3SUMS.txt SHA256SUMS.txt astrid-*-release.toml; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done

      - name: Select and authenticate the exact release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRERELEASE: ${{ needs.classify.outputs.nightly }}
        run: |
          CANDIDATE="$GITHUB_WORKSPACE/artifacts"
          PAYLOADS="$RUNNER_TEMP/release-payloads.txt"
          python3 scripts/release_publication.py \
            --artifacts "$CANDIDATE" \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --contracts-commit "$CONTRACTS_COMMIT" > "$PAYLOADS"
          (
            cd "$CANDIDATE"
            b3sum --check BLAKE3SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          IDENTITY="https://github.com/astrid-runtime/astrid/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          ISSUER="https://token.actions.githubusercontent.com"
          while IFS= read -r asset; do
            cosign verify-blob \
              --bundle "$CANDIDATE/${asset}.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              --use-signed-timestamps \
              "$CANDIDATE/$asset"
          done < "$PAYLOADS"

          if [[ "$EXISTING_RELEASE" == 1 ]]; then
            RELEASES="$RUNNER_TEMP/releases-candidate.json"
            MATCHING_RELEASE="$RUNNER_TEMP/matching-release.json"
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --paginate --slurp > "$RELEASES"
            jq --arg tag "$GITHUB_REF_NAME" \
              '[.[][] | select(.tag_name == $tag)]' "$RELEASES" > "$MATCHING_RELEASE"
            jq -e --argjson prerelease "$EXPECTED_PRERELEASE" \
              --arg tag "$GITHUB_REF_NAME" \
              'length == 1 and .[0].draft == true and .[0].prerelease == $prerelease and .[0].published_at == null and .[0].name == $tag' \
              "$MATCHING_RELEASE" >/dev/null
            jq -e --rawfile notes release-notes.md \
              'length == 1 and .[0].body == $notes' "$MATCHING_RELEASE" >/dev/null
            RELEASE_ID=$(jq -er '.[0].id' "$MATCHING_RELEASE")
            echo "SELECTED_RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

            ASSETS="$RUNNER_TEMP/existing-release-assets.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --paginate --slurp > "$ASSETS"
            jq -e '[.[][]] | all(.state == "uploaded" and .size > 0)' "$ASSETS" >/dev/null
            jq -e '[.[][]] as $assets | ([$assets[].name] | unique | length) == ($assets | length)' \
              "$ASSETS" >/dev/null
            EXISTING="$RUNNER_TEMP/existing-release-assets"
            mkdir "$EXISTING"
            if jq -e '[.[][]] | length > 0' "$ASSETS" >/dev/null; then
              gh release download "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --dir "$EXISTING"
            fi
            MISSING="$RUNNER_TEMP/missing-release-assets.txt"
            EXISTING_BUNDLES="$RUNNER_TEMP/existing-release-bundles.txt"
            python3 scripts/release_draft_recovery.py \
              --candidate "$CANDIDATE" \
              --existing "$EXISTING" \
              --payloads "$PAYLOADS" \
              --missing-output "$MISSING" \
              --existing-bundles-output "$EXISTING_BUNDLES"
            while IFS= read -r bundle; do
              [[ -n "$bundle" ]] || continue
              asset="${bundle%.sigstore.json}"
              cosign verify-blob \
                --bundle "$EXISTING/$bundle" \
                --certificate-identity "$IDENTITY" \
                --certificate-oidc-issuer "$ISSUER" \
                --use-signed-timestamps \
                "$CANDIDATE/$asset"
            done < "$EXISTING_BUNDLES"
            while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              gh release upload "$GITHUB_REF_NAME" "$CANDIDATE/$asset" \
                --repo "$GITHUB_REPOSITORY"
            done < "$MISSING"

            CANDIDATE="$RUNNER_TEMP/recovered-release-assets"
            mkdir "$CANDIDATE"
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$CANDIDATE"
            python3 scripts/release_publication.py \
              --artifacts "$CANDIDATE" \
              --version "$VERSION" \
              --source-commit "$SOURCE_COMMIT" \
              --contracts-commit "$CONTRACTS_COMMIT" > "$PAYLOADS"
            (
              cd "$CANDIDATE"
              b3sum --check BLAKE3SUMS.txt
              sha256sum --check SHA256SUMS.txt
            )
            while IFS= read -r asset; do
              cosign verify-blob \
                --bundle "$CANDIDATE/${asset}.sigstore.json" \
                --certificate-identity "$IDENTITY" \
                --certificate-oidc-issuer "$ISSUER" \
                --use-signed-timestamps \
                "$CANDIDATE/$asset"
            done < "$PAYLOADS"
          fi
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"

      - name: Verify release archives with the native updater policy
        env:
          ASTRID_RELEASE_GATE_VERSION: ${{ github.ref_name }}
          CARGO_BUILD_JOBS: "1"
        run: |
          export ASTRID_RELEASE_GATE_ARTIFACTS="$CANDIDATE"
          ASTRID_RELEASE_GATE_VERSION="${ASTRID_RELEASE_GATE_VERSION#v}"
          export ASTRID_RELEASE_GATE_VERSION
          cargo test -p astrid --bin astrid --locked \
            commands::update_auth::tests::release_gate_authenticates_all_archives_with_production_policy \
            -- --ignored --exact

      - name: Authenticate the remote tag before candidate publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ needs.classify.outputs.source-commit }}
          NIGHTLY: ${{ needs.classify.outputs.nightly }}
        run: |
          TAG_OBJECT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          TAG_TYPE=$(jq -er .object.type <<< "$TAG_OBJECT")
          TAG_COMMIT=$(jq -er .object.sha <<< "$TAG_OBJECT")
          for _ in {1..8}; do
            [[ "$TAG_TYPE" == tag ]] || break
            TAG_OBJECT=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_COMMIT")
            TAG_TYPE=$(jq -er .object.type <<< "$TAG_OBJECT")
            TAG_COMMIT=$(jq -er .object.sha <<< "$TAG_OBJECT")
          done
          [[ "$TAG_TYPE" == commit ]]
          [[ "$TAG_COMMIT" == "$EXPECTED_SOURCE" ]]
          if [[ "$NIGHTLY" == true ]]; then
            BASE_VERSION=$(python3 - <<'PY'
          import tomllib
          with open("release/nightly.toml", "rb") as file:
              print(tomllib.load(file)["base-version"])
          PY
            )
            BASE_REFS="$RUNNER_TEMP/canonical-base-refs.json"
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$BASE_VERSION" > "$BASE_REFS"
            if ! jq -e --arg ref "refs/tags/v$BASE_VERSION" 'all(.ref != $ref)' "$BASE_REFS" >/dev/null; then
              echo "canonical v$BASE_VERSION was tagged while this nightly waited for approval" >&2
              exit 1
            fi
          fi

      - name: Require native FSKit mount certification for the tagged source
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATION_CHECK: Native FSKit mount certification
        run: |
          CHECKS="$RUNNER_TEMP/native-fskit-certification.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/commits/$SOURCE_COMMIT/check-runs?per_page=100" \
            > "$CHECKS"
          jq -e \
            --arg name "$CERTIFICATION_CHECK" \
            --arg source "$SOURCE_COMMIT" \
            '[.[] | .check_runs[] |
              select((.name == $name or (.name | endswith(" / " + $name))) and
                     .head_sha == $source and
                     .app.slug == "github-actions")] |
             sort_by(.started_at) | last |
             .status == "completed" and .conclusion == "success"' \
            "$CHECKS" >/dev/null || {
              echo "the tagged source lacks a successful native FSKit mount certification" >&2
              exit 1
            }

      - name: Require the release tag to remain unused before draft creation
        if: env.EXISTING_RELEASE != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASES="$RUNNER_TEMP/releases-before-create.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp > "$RELEASES"
          jq -e --arg tag "$GITHUB_REF_NAME" \
            '[.[][] | select(.tag_name == $tag)] | length == 0' "$RELEASES" >/dev/null

      - name: Create draft release with write-once assets
        if: env.EXISTING_RELEASE != '1'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          prerelease: ${{ needs.classify.outputs.nightly == 'true' }}
          make_latest: false
          overwrite_files: false
          preserve_order: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/BLAKE3SUMS.txt
            artifacts/SHA256SUMS.txt
            artifacts/astrid-*-release.toml
            artifacts/*.sigstore.json
          body_path: release-notes.md

      - name: Bind newly created draft identity
        if: env.EXISTING_RELEASE != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRERELEASE: ${{ needs.classify.outputs.nightly }}
        run: |
          RELEASES="$RUNNER_TEMP/releases-after-create.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp > "$RELEASES"
          RELEASE_ID=$(jq -er --arg tag "$GITHUB_REF_NAME" --argjson prerelease "$EXPECTED_PRERELEASE" \
            '[.[][] | select(.tag_name == $tag) | select(.draft == true and .prerelease == $prerelease and .published_at == null)] | select(length == 1) | .[0].id' \
            "$RELEASES")
          echo "SELECTED_RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Reauthenticate and publish the exact immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRERELEASE: ${{ needs.classify.outputs.nightly }}
          EXPECTED_SOURCE: ${{ needs.classify.outputs.source-commit }}
        run: |
          EXPECTED_LATEST=true
          if [[ "$EXPECTED_PRERELEASE" == true ]]; then
            EXPECTED_LATEST=false
          fi
          TAG_OBJECT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          TAG_TYPE=$(jq -er .object.type <<< "$TAG_OBJECT")
          TAG_COMMIT=$(jq -er .object.sha <<< "$TAG_OBJECT")
          for _ in {1..8}; do
            [[ "$TAG_TYPE" == tag ]] || break
            TAG_OBJECT=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_COMMIT")
            TAG_TYPE=$(jq -er .object.type <<< "$TAG_OBJECT")
            TAG_COMMIT=$(jq -er .object.sha <<< "$TAG_OBJECT")
          done
          [[ "$TAG_TYPE" == commit ]]
          [[ "$TAG_COMMIT" == "$EXPECTED_SOURCE" ]]
          if [[ "$EXPECTED_PRERELEASE" == true ]]; then
            BASE_VERSION=$(python3 - <<'PY'
          import tomllib
          with open("release/nightly.toml", "rb") as file:
              print(tomllib.load(file)["base-version"])
          PY
            )
            BASE_REFS="$RUNNER_TEMP/canonical-base-refs.json"
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$BASE_VERSION" > "$BASE_REFS"
            if ! jq -e --arg ref "refs/tags/v$BASE_VERSION" 'all(.ref != $ref)' "$BASE_REFS" >/dev/null; then
              echo "canonical v$BASE_VERSION was tagged before nightly publication" >&2
              exit 1
            fi
          fi
          RELEASES="$RUNNER_TEMP/releases-before-publish.json"
          MATCHING_RELEASE="$RUNNER_TEMP/matching-release-before-publish.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --slurp > "$RELEASES"
          jq --arg tag "$GITHUB_REF_NAME" \
            '[.[][] | select(.tag_name == $tag)]' "$RELEASES" > "$MATCHING_RELEASE"
          jq -e --argjson prerelease "$EXPECTED_PRERELEASE" \
            'length == 1 and .[0].draft == true and .[0].prerelease == $prerelease and .[0].published_at == null' \
            "$MATCHING_RELEASE" >/dev/null
          RELEASE_ID=$(jq -er '.[0].id' "$MATCHING_RELEASE")
          [[ "$RELEASE_ID" == "$SELECTED_RELEASE_ID" ]]
          ASSETS="$RUNNER_TEMP/release-assets-before-publish.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --paginate --slurp > "$ASSETS"
          jq -e '[.[][]] | all(.state == "uploaded" and .size > 0)' "$ASSETS" >/dev/null
          jq -e '[.[][]] as $assets | ([$assets[].name] | unique | length) == ($assets | length)' \
            "$ASSETS" >/dev/null

          FINAL="$RUNNER_TEMP/final-release-assets"
          mkdir "$FINAL"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$FINAL"
          PAYLOADS="$RUNNER_TEMP/final-release-payloads.txt"
          python3 scripts/release_publication.py \
            --artifacts "$FINAL" \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --contracts-commit "$CONTRACTS_COMMIT" > "$PAYLOADS"
          (
            cd "$FINAL"
            b3sum --check BLAKE3SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          IDENTITY="https://github.com/astrid-runtime/astrid/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          while IFS= read -r asset; do
            cmp "$CANDIDATE/$asset" "$FINAL/$asset"
            cmp "$CANDIDATE/${asset}.sigstore.json" "$FINAL/${asset}.sigstore.json"
            cosign verify-blob \
              --bundle "$FINAL/${asset}.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --use-signed-timestamps \
              "$FINAL/$asset"
          done < "$PAYLOADS"

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest="$EXPECTED_LATEST" \
            | jq -e --argjson prerelease "$EXPECTED_PRERELEASE" \
              'select(.draft == false and .immutable == true and .prerelease == $prerelease and .published_at != null) | true' \
            | grep -Fx true
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            | jq -e --argjson prerelease "$EXPECTED_PRERELEASE" \
              'select(.draft == false and .immutable == true and .prerelease == $prerelease and .published_at != null) | true' \
            | grep -Fx true
