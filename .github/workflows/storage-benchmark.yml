name: Storage benchmark evidence

on:
  workflow_dispatch:
    inputs:
      bytes:
        description: Deterministic corpus size in bytes
        required: true
        default: '67108864'
      samples:
        description: Samples per repeatable workload
        required: true
        default: '3'
      packing_baseline:
        description: Optional exact baseline commit for same-host volume packing comparison
        default: ''
      packing_candidate:
        description: Optional exact candidate commit for same-host volume packing comparison
        default: ''
      native250_baseline:
        description: Optional exact baseline commit for portable matched native250 evidence
        default: ''
      native250_candidate:
        description: Optional exact candidate commit for portable matched native250 evidence
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    if: inputs.packing_baseline == '' && inputs.packing_candidate == '' && inputs.native250_baseline == '' && inputs.native250_candidate == ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Capture storage evidence
        shell: bash
        env:
          BENCH_BYTES: ${{ inputs.bytes }}
          BENCH_SAMPLES: ${{ inputs.samples }}
        run: |
          cargo bench -p astrid-storage --bench storage_io -- \
            --bytes "$BENCH_BYTES" \
            --samples "$BENCH_SAMPLES" \
            --small-files 32 \
            --concurrent-principals 4 \
            --bulk-workers 4 \
            --bulk-files 32 \
            --object-cache-bytes 268435456 \
            --output 'storage-benchmark-${{ matrix.name }}.json'

      - name: Upload content-bound report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storage-benchmark-${{ github.sha }}-${{ matrix.name }}
          path: storage-benchmark-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

  matched-packing:
    if: inputs.packing_baseline != '' || inputs.packing_candidate != ''
    name: Same-host macOS arm64 packing evidence
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out benchmark protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: protocol
          persist-credentials: false
      - name: Validate exact revisions
        env:
          BASELINE: ${{ inputs.packing_baseline }}
          CANDIDATE: ${{ inputs.packing_candidate }}
        run: |
          python3 - <<'PY'
          import os, re
          for key in ('BASELINE', 'CANDIDATE'):
              if re.fullmatch(r'[0-9a-f]{40}', os.environ[key]) is None:
                  raise SystemExit(f'{key} must be a full commit SHA')
          PY
      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.packing_baseline }}
          path: baseline
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.packing_candidate }}
          path: candidate
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: '1.95.0'
      - name: Collect matched unlogged evidence
        env:
          BASELINE: ${{ inputs.packing_baseline }}
          CANDIDATE: ${{ inputs.packing_candidate }}
        run: |
          python3 protocol/scripts/benchmarks/matched_volume_packing.py \
            --baseline "$GITHUB_WORKSPACE/baseline" \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --baseline-head "$BASELINE" --candidate-head "$CANDIDATE" \
            --output "$GITHUB_WORKSPACE/packing-evidence"
      - name: Preserve evidence including failed samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matched-packing-${{ github.sha }}
          path: packing-evidence
          if-no-files-found: warn
          retention-days: 30

  matched-native250:
    if: inputs.native250_baseline != '' || inputs.native250_candidate != ''
    name: Same-host macOS arm64 native250 evidence
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out benchmark protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: protocol
          persist-credentials: false
      - name: Validate exact revisions
        env:
          BASELINE: ${{ inputs.native250_baseline }}
          CANDIDATE: ${{ inputs.native250_candidate }}
        run: |
          python3 - <<'PY'
          import os, re
          for key in ('BASELINE', 'CANDIDATE'):
              if re.fullmatch(r'[0-9a-f]{40}', os.environ[key]) is None:
                  raise SystemExit(f'{key} must be a full commit SHA')
          PY
      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.native250_baseline }}
          path: baseline
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.native250_candidate }}
          path: candidate
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
      - name: Collect matched native250 evidence
        env:
          BASELINE: ${{ inputs.native250_baseline }}
          CANDIDATE: ${{ inputs.native250_candidate }}
        run: |
          python3 protocol/scripts/benchmarks/matched_native250.py \
            --baseline "$GITHUB_WORKSPACE/baseline" \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --baseline-head "$BASELINE" --candidate-head "$CANDIDATE" \
            --output "$GITHUB_WORKSPACE/native250-evidence"
      - name: Preserve evidence including failed samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matched-native250-${{ github.sha }}
          path: native250-evidence/public
          if-no-files-found: warn
          retention-days: 30
